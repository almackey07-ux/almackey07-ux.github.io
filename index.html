<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Pike Fishing Trip - Lough Corrib</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Segoe UI',sans-serif;
}

body{

color:white;
text-align:center;
padding:20px;
background:#1b5e20;
transition:background 1s;

}

.section{

margin:25px 0;
padding:20px;
background:rgba(0,0,0,0.25);
border-radius:15px;
box-shadow:0 8px 20px rgba(0,0,0,0.3);

}

.weather{

display:flex;
justify-content:center;
gap:10px;
margin-top:8px;
flex-wrap:wrap;

}

.audio-toggle{

margin-top:15px;
cursor:pointer;
color:#a5d6a7;

}

.good {color:#69f0ae;}
ok {color:#ffd740;}
bad {color:#ff5252;}

</style>
</head>
<body>


<h1>🎣 Pike Fishing Trip – Lough Corrib 🇮🇪</h1>
<h2>Leaving 7th March at 5:00 AM</h2>



<!-- COUNTDOWN -->

<div class="section">

<span id="days"></span>d
<span id="hours"></span>h
<span id="minutes"></span>m
<span id="seconds"></span>s

</div>



<!-- CONDITIONS -->

<div class="section">

<h3>🌦 Conditions</h3>


<div class="weather">

<span id="weather-temp"></span>

<span id="wind-speed"></span>

<span id="wind-dir"></span>

</div>


<div class="weather">

🌊 Level:

<span id="water-level"></span>

</div>


<div class="weather">

🌡 Pressure:

<span id="pressure"></span>

<span id="pressure-trend"></span>

</div>


<div class="weather">

🌙 Moon:

<span id="moon"></span>

</div>


<div class="weather">

🐊 Feeding:

<span id="feeding"></span>

</div>


<div class="weather">

🎣 Lure:

<span id="lure"></span>

</div>


<div class="weather">

🔥 Pike Activity:

<span id="activity"></span>

</div>


</div>



<!-- SOUND -->

<audio id="sound" loop preload="auto">

<source src="https://cdn.pixabay.com/download/audio/2022/03/15/audio_c8c8a73467.mp3">

</audio>

<div class="audio-toggle" id="audio">

🔊 Toggle Lake Sound

</div>



<script>

document.addEventListener("DOMContentLoaded",()=>{


/* COUNTDOWN */


let trip=new Date("March 7 2026 05:00");


setInterval(()=>{

let now=new Date();

let diff=trip-now;

days.innerText=Math.floor(diff/86400000);

hours.innerText=Math.floor(diff/3600000)%24;

minutes.innerText=Math.floor(diff/60000)%60;

seconds.innerText=Math.floor(diff/1000)%60;

},1000);




/* WEATHER + PRESSURE */


let lastPressure=null;


async function updateWeather(){


let res=await fetch(

"https://api.open-meteo.com/v1/forecast?latitude=53.45&longitude=-9.23&current_weather=true&hourly=surface_pressure"

);


let data=await res.json();


let w=data.current_weather;


weather-temp.innerText=w.temperature+"°C";

wind-speed.innerText=w.windspeed+" km/h";


wind-dir.innerText=

compass(w.winddirection);



/* pressure */


let p=data.hourly.surface_pressure[0];

pressure.innerText=p+" hPa";


if(lastPressure){

if(p>lastPressure)

pressure-trend.innerText="⬆ Rising";

else if(p<lastPressure)

pressure-trend.innerText="⬇ Falling";

else

pressure-trend.innerText="→ Stable";

}

lastPressure=p;



updateLure(w.temperature,w.windspeed,p);

updateActivity(p);


}


updateWeather();

setInterval(updateWeather,600000);




/* WATER */


async function water(){


let res=await fetch(

"https://waterlevel.ie/hydro-data/api/Measurements?stationId=19002&numDays=1"

);


let data=await res.json();


water-level.innerText=

data.at(-1).value.toFixed(2)+"m";


}


water();

setInterval(water,600000);




/* MOON */


function moonPhase(){


let lp=2551443;

let now=new Date();

let new_moon=new Date(1970,0,7);

let phase=((now-new_moon)/1000)%lp;

let index=Math.floor((phase/lp)*8);


let phases=[

"New","Waxing Crescent","Quarter",

"Waxing Gibbous","Full 🌕",

"Waning Gibbous","Last Quarter",

"Waning Crescent"

];


moon.innerText=phases[index];


feeding.innerText=

(index==4||index==0)

?"Excellent":"Good";


}


moonPhase();




/* LURE */


function updateLure(temp,wind,pressure){


if(pressure<1005)

lure.innerText="🔥 Big lures / jerkbaits";


else if(temp<6)

lure.innerText="Deadbait";


else if(wind>15)

lure.innerText="Spinnerbait";


else

lure.innerText="Soft plastic";


}




/* ACTIVITY */


function updateActivity(p){


if(p<1000)

activity.innerText="🔥 Excellent";


else if(p<1015)

activity.innerText="👍 Good";


else

activity.innerText="Slow";


}




/* COMPASS */


function compass(d){

return["N","NE","E","SE","S","SW","W","NW"]

[Math.round(d/45)%8];

}




/* SOUND */


let sound=document.getElementById("sound");

sound.volume=0.4;

let playing=false;


audio.onclick=async()=>{

if(!playing){

await sound.play();

playing=true;

}

else{

sound.pause();

playing=false;

}

};


});


</script>

</body>
</html>
