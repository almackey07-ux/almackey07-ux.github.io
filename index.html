<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Pike Fishing Trip Corrib</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #111;
      color: #fff;
      margin: 0;
      padding: 20px;
    }
    h1, h2 {
      margin-top: 0;
    }
    .card {
      background: #222;
      padding: 15px;
      margin-bottom: 20px;
      border-radius: 10px;
    }
    .label {
      font-weight: bold;
      color: #4fc3f7;
    }
  </style>
</head>

<body>

  <h1>Pike Fishing Trip Dashboard</h1>

  <!-- WEATHER -->
  <div class="card">
    <h2>Weather</h2>
    <div><span class="label">Temperature:</span> <span id="temp">Loading...</span></div>
    <div><span class="label">Wind:</span> <span id="wind">Loading...</span></div>
  </div>

  <!-- PIKE CONDITIONS -->
  <div class="card">
    <h2>Pike Conditions</h2>
    <div><span class="label">Water Level:</span> <span id="water">Loading...</span></div>
    <div><span class="label">Pressure:</span> <span id="pressure">993.4 hPa</span></div>
    <div><span class="label">Moon:</span> <span id="moon">Quarter</span></div>
    <div><span class="label">Feeding:</span> <span id="feeding">Good</span></div>
    <div><span class="label">Lure:</span> <span id="lure">Big jerkbaits</span></div>
    <div><span class="label">Activity:</span> <span id="activity">Excellent</span></div>
  </div>

  <!-- TRAVEL -->
  <div class="card">
    <h2>Live Travel Time</h2>
    <div id="travel">Loading...</div>
  </div>

  <!-- PACK LIST -->
  <div class="card">
    <h2>Pack List</h2>
    <ul>
      <li>Beers 🍺</li>
      <li>Deadbait Rod</li>
      <li>Lure Rod</li>
    </ul>
  </div>

<script>
  // WEATHER API (Open-Meteo)
  async function loadWeather() {
    try {
      const r = await fetch("https://api.open-meteo.com/v1/forecast?latitude=53.2&longitude=-6.1&current_weather=true");
      const data = await r.json();
      document.getElementById("temp").textContent = data.current_weather.temperature + "°C";
      document.getElementById("wind").textContent = data.current_weather.windspeed + " km/h";
    } catch {
      document.getElementById("temp").textContent = "Error";
      document.getElementById("wind").textContent = "Error";
    }
  }

  // WATER LEVEL (Cloudflare Function)
  async function loadWater() {
    try {
      const r = await fetch("/water");
      const data = await r.json();

      if (!data || !data.value) {
        document.getElementById("water").textContent = "Error";
        return;
      }

      document.getElementById("water").textContent = data.value + "m";
    } catch {
      document.getElementById("water").textContent = "Error";
    }
  }

  // TRAVEL TIME (Cloudflare Function)
  async function loadTravel() {
    try {
      const r = await fetch("/travel");
      const data = await r.json();

      if (!data.routes || !data.routes[0]) {
        document.getElementById("travel").textContent = "Travel error";
        return;
      }

      const duration = data.routes[0].duration;
      document.getElementById("travel").textContent = "Travel time: " + duration;
    } catch {
      document.getElementById("travel").textContent = "Travel error";
    }
  }

  // INIT
  loadWeather();
  loadWater();
  loadTravel();
</script>

</body>
</html>
