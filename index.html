<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pike Fishing Trip - Lough Corrib</title>

<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Segoe UI',sans-serif;}

body{
color:white;
text-align:center;
padding:20px;
background:linear-gradient(#2c5364,#203a43,#0f2027);
}

.section{
margin:22px 0;
padding:20px;
background:rgba(255,255,255,0.08);
border-radius:18px;
box-shadow:0 8px 25px rgba(0,0,0,0.35);
backdrop-filter:blur(6px);
}

.countdown{
display:flex;
justify-content:center;
gap:14px;
flex-wrap:wrap;
}

.tile{
background:rgba(255,255,255,0.12);
padding:18px;
border-radius:14px;
min-width:90px;
}

.tile .num{font-size:28px;font-weight:700;}
.tile .label{font-size:13px;opacity:.8;}

.row{
display:flex;
justify-content:center;
gap:12px;
flex-wrap:wrap;
margin-top:8px;
}

.checklist{text-align:left;display:inline-block;font-size:16px;}
.checklist label{display:block;margin:8px 0;cursor:pointer;}

.audio-toggle{
margin-top:18px;
cursor:pointer;
color:#a5d6a7;
font-size:18px;
}
</style>
</head>

<body>

<h1>🎣 Pike Fishing Trip – Lough Corrib 🇮🇪</h1>
<h2>Leaving 7th March at 5:00 AM</h2>

<!-- COUNTDOWN -->
<div class="section">
<div class="countdown">
<div class="tile"><div id="days" class="num">0</div><div class="label">Days</div></div>
<div class="tile"><div id="hours" class="num">0</div><div class="label">Hours</div></div>
<div class="tile"><div id="minutes" class="num">0</div><div class="label">Minutes</div></div>
<div class="tile"><div id="seconds" class="num">0</div><div class="label">Seconds</div></div>
</div>
</div>

<!-- WEATHER -->
<div class="section">
<h3>🌦 Weather</h3>
<div class="row">
<span id="weather-temp"></span>
<span id="wind-speed"></span>
<span id="wind-dir"></span>
</div>
</div>

<!-- CONDITIONS -->
<div class="section">
<h3>🎯 Pike Conditions</h3>
<div class="row">🌊 Level: <span id="water-level">Loading…</span></div>
<div class="row">🌡 Pressure: <span id="pressure"></span> <span id="pressure-trend"></span></div>
<div class="row">🌙 Moon: <span id="moon"></span></div>
<div class="row">🐊 Feeding: <span id="feeding"></span></div>
<div class="row">🎣 Lure: <span id="lure"></span></div>
<div class="row">🔥 Activity: <span id="activity"></span></div>
</div>

<!-- PACK LIST -->
<div class="section">
<h3>🎒 Pack List</h3>
<div class="checklist">
<label><input type="checkbox"> Beers 🍺</label>
<label><input type="checkbox"> Deadbait Rod</label>
<label><input type="checkbox"> Lure Rod</label>
<label><input type="checkbox"> Life Jacket</label>
<label><input type="checkbox"> Lures</label>
<label><input type="checkbox"> Net</label>
<label><input type="checkbox"> Deadbaits</label>
<label><input type="checkbox"> Waders</label>
<label><input type="checkbox"> Waterproof Jacket</label>
<label><input type="checkbox"> Signed Permission Slip</label>
</div>
</div>

<audio id="lakeSound" loop preload="auto">
<source src="https://cdn.pixabay.com/download/audio/2022/03/15/audio_c8c8a73467.mp3">
</audio>

<div class="audio-toggle" id="soundBtn">🔊 Enable Lake Sounds</div>

<script>
const el=id=>document.getElementById(id)

/* COUNTDOWN */

const trip=new Date("2026-03-07T05:00:00")
function tick(){
let d=trip-new Date()
if(d<0)d=0
el("days").innerText=Math.floor(d/86400000)
el("hours").innerText=Math.floor(d/3600000)%24
el("minutes").innerText=Math.floor(d/60000)%60
el("seconds").innerText=Math.floor(d/1000)%60
}
tick()
setInterval(tick,1000)

/* WEATHER */

let lastPressure=null

async function weather(){
try{
let r=await fetch("https://api.open-meteo.com/v1/forecast?latitude=53.45&longitude=-9.23&current_weather=true&hourly=surface_pressure")
let j=await r.json()
let w=j.current_weather

el("weather-temp").innerText=w.temperature+"°C"
el("wind-speed").innerText=w.windspeed+" km/h"
el("wind-dir").innerText=compass(w.winddirection)

let p=j.hourly.surface_pressure[0]
el("pressure").innerText=p+" hPa"

if(lastPressure!==null){
el("pressure-trend").innerText=p>lastPressure?"⬆":"⬇"
}
lastPressure=p

updateLure(w.temperature,w.windspeed,p)
updateActivity(p)

}catch(e){
console.log("weather fail",e)
}
}
weather()
setInterval(weather,600000)

/* WATER LEVEL — FIXED WITH CORS PROXY */

async function water(){
try{
const target="https://waterlevel.ie/hydro-data/api/Measurements?stationIdIerationId=19002&numDays=1"
const proxy="https://api.allorigins.win/raw?url="+encodeURIComponent(target)

const r=await fetch(proxy,{cache:"no-store"})
const j=await r.json()

if(j && j.length){
el("water-level").innerText=j.at(-1).value.toFixed(2)+" m"
}else{
el("water-level").innerText="Unavailable"
}

}catch(e){
console.log("water fail",e)
el("water-level").innerText="Unavailable"
}
}
water()
setInterval(water,600000)

/* MOON */

function moon(){
let lp=2551443
let phase=((Date.now()/1000)%lp)
let i=Math.floor((phase/lp)*8)
let p=["New","Waxing","Quarter","Gibbous","Full 🌕","Waning","Last Q","Crescent"]
el("moon").innerText=p[i]
el("feeding").innerText=(i==0||i==4)?"Excellent":"Good"
}
moon()

/* LURE */

function updateLure(t,w,p){
el("lure").innerText=
p<1005?"🔥 Big jerkbaits":
t<6?"Deadbait":
w>15?"Spinnerbait":
"Soft plastics"
}

/* ACTIVITY */

function updateActivity(p){
el("activity").innerText=
p<1000?"🔥 Excellent":
p<1015?"👍 Good":
"Slow"
}

/* COMPASS */

function compass(d){
return["N","NE","E","SE","S","SW","W","NW"][Math.round(d/45)%8]
}

/* SOUND TOGGLE — FIXED */

const sound=el("lakeSound")
const btn=el("soundBtn")
sound.volume=.4
let on=false

btn.addEventListener("click",async()=>{
try{
if(!on){
await sound.play()
btn.innerText="🔊 Lake Sounds ON"
on=true
}else{
sound.pause()
btn.innerText="🔈 Lake Sounds OFF"
on=false
}
}catch(e){
alert("Tap again — browser blocked first play attempt")
}
})

</script>

</body>
</html>
